{% extends "base.html" %}
{% block title %}Eu{% endblock %}
{% block content %}
<h1>{{ employee.name }}</h1>
{% if done %}<p class="alert alert-ok" role="status">{{ done }}</p>{% endif %}
{% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
<section class="card state">
  {% if inside_since %}
  <p class="state-line"><strong>în Sală din {{ inside_since }}</strong></p>
  <form method="post" action="/me/exit"><input type="hidden" name="totp" value="{{ totp }}"><button type="submit" class="btn btn-big">Ieșire</button></form>
  {% else %}
  <p class="state-line"><strong>în afara Sălii</strong></p>
  <form method="post" action="/me/entry"><input type="hidden" name="totp" value="{{ totp }}"><button type="submit" class="btn btn-big">Intrare</button></form>
  {% endif %}
</section>
{% endblock %}
