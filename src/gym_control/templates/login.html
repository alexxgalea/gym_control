{% extends "base.html" %}
{% block title %}Autentificare{% endblock %}
{% block content %}
<h1>Autentificare Admin</h1>
{% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login" class="card stack">
  <label>Cont
    <input name="username" autocomplete="username" required autofocus>
  </label>
  <label>Parolă
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button type="submit" class="btn">Intră</button>
</form>
{% endblock %}
