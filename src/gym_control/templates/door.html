{% extends "base.html" %}
{% block title %}Ușa{% endblock %}
{% block content %}
<h1>Scanează pentru Intrare / Ieșire</h1>
<section class="card" id="qr-holder">{% include "door_qr.html" %}</section>
<p class="muted">Codul se schimbă automat la 30 de secunde.</p>
<script>
  // Reînnoire fără intervenție: cere fragmentul la fiecare 10 s; codul se schimbă la 30 s pe ceasul serverului.
  setInterval(function () {
    fetch("/door/qr", {cache: "no-store"})
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (html) { if (html) document.getElementById("qr-holder").innerHTML = html; })
      .catch(function () {});
  }, 10000);
</script>
{% endblock %}
