[project]
name = "gym-control"
version = "0.1.0"
description = "Pontaj Intrare/Ieșire pentru Sală, cu QR TOTP"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "jinja2>=3.1", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gym_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
